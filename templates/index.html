<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hospital Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { font-family: Arial; padding: 20px; }
    #map { height: 600px; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Hospital Map</h1>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map = L.map('map').setView([20.5937, 78.9629], 5);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: 'Map data © OpenStreetMap contributors'
    }).addTo(map);

    function showHospitals(hospitals) {
      hospitals.forEach(h => {
        if (h.latitude && h.longitude) {
          const marker = L.marker([h.latitude, h.longitude], { icon: redIcon() }).addTo(map);
          marker.bindPopup(`
            <b>${h.name}</b><br>
            ${h.address}<br>
            Phone: ${h.phone}
          `);
        }
      });
    }

    function redIcon() {
      return new L.Icon({
        iconUrl: 'https://cdn.rawgit.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
        shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
        shadowSize: [41, 41]
      });
    }

    // Load all hospitals on map
    window.onload = () => {
      fetch('/get-hospitals/')
        .then(res => res.json())
        .then(data => {
          showHospitals(data.hospitals);
        })
        .catch(err => console.error("Error loading hospitals:", err));
    };
  </script>
</body>
</html>
