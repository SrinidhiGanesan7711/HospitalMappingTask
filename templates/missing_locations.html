<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hospitals Without Location</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 8px; }
    th { background-color: #f2f2f2; }
  </style>
</head>
<body>
  <h1>Hospitals Without Location</h1>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Address</th>
        <th>Pincode</th>
        <th>Phone</th>
      </tr>
    </thead>
    <tbody id="hospital-table-body">
    </tbody>
  </table>

  <script>
    fetch('/get-hospitals-without-location/')
      .then(res => res.json())
      .then(data => {
        const body = document.getElementById('hospital-table-body');
        data.hospitals.forEach(h => {
          const row = `<tr>
            <td>${h.name}</td>
            <td>${h.address}</td>
            <td>${h.pincode || ''}</td>
            <td>${h.phone || ''}</td>
          </tr>`;
          body.insertAdjacentHTML('beforeend', row);
        });
      })
      .catch(err => {
        console.error("Error loading missing hospital data:", err);
        document.body.innerHTML += "<p style='color: red;'>Failed to load hospitals without location</p>";
      });
  </script>
</body>
</html>
